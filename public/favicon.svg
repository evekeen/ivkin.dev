<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Stronger glowing effect filter -->
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Brighter gradient for better visibility -->
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00b8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c5cff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Dark background for contrast -->
  <rect width="100" height="100" fill="#000000" rx="15"/>

  <!-- Outer glow background -->
  <text
    x="50"
    y="74"
    font-family="Arial, Helvetica, sans-serif"
    font-size="68"
    font-weight="900"
    text-anchor="middle"
    fill="url(#aiGradient)"
    opacity="0.3"
    filter="url(#glow)">ai</text>

  <!-- Main text with strong contrast -->
  <text
    x="50"
    y="74"
    font-family="Arial, Helvetica, sans-serif"
    font-size="68"
    font-weight="900"
    text-anchor="middle"
    fill="url(#aiGradient)"
    filter="url(#glow)">ai</text>
</svg>
